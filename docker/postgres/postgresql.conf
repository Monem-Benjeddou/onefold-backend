# PostgreSQL Configuration for High Concurrency
# Optimized for handling 200+ concurrent connections

# Network Settings
listen_addresses = '*'                 # Listen on all interfaces

# Connection Settings
max_connections = 200                  # Maximum number of concurrent connections
superuser_reserved_connections = 3     # Reserved connections for superuser

# Memory Settings (adjust based on available RAM)
shared_buffers = 2GB                   # 25% of total RAM
effective_cache_size = 6GB             # 75% of total RAM
work_mem = 256MB                       # Memory per query operation
maintenance_work_mem = 1GB             # Memory for maintenance operations

# Connection Pooling
max_prepared_transactions = 100        # For prepared transactions
max_locks_per_transaction = 128        # Locks per transaction

# Write Performance
wal_buffers = 16MB                     # WAL buffer size
checkpoint_completion_target = 0.9     # Checkpoint completion target
max_wal_size = 4GB                     # Maximum WAL size
min_wal_size = 1GB                     # Minimum WAL size

# Query Tuning
random_page_cost = 1.1                 # SSD optimized
effective_io_concurrency = 200         # For parallel I/O operations
default_statistics_target = 100        # Statistics sampling

# Logging
log_statement = 'none'                 # Log statements (none, ddl, mod, all)
log_duration = off                     # Log statement duration
log_min_duration_statement = 1000      # Log slow queries (> 1 second)
log_connections = off                  # Log connections
log_disconnections = off               # Log disconnections

# Connection Timeouts
statement_timeout = 30000              # 30 seconds
lock_timeout = 10000                   # 10 seconds
idle_in_transaction_session_timeout = 60000  # 60 seconds

# Background Workers
max_worker_processes = 8               # Maximum background workers
max_parallel_workers_per_gather = 4    # Parallel workers per query
max_parallel_workers = 8               # Total parallel workers

# Autovacuum Settings
autovacuum = on                        # Enable autovacuum
autovacuum_max_workers = 4             # Autovacuum workers
autovacuum_naptime = 30s               # Autovacuum check interval
autovacuum_vacuum_threshold = 50       # Minimum rows before vacuum
autovacuum_vacuum_scale_factor = 0.1   # Fraction of table size before vacuum

# Connection Keep-Alive
tcp_keepalives_idle = 30               # TCP keepalive idle time
tcp_keepalives_interval = 10           # TCP keepalive interval
tcp_keepalives_count = 5               # TCP keepalive count