# Redis Configuration for KOLCT API
# Security and authentication settings

# Enable authentication - password will be set via environment variable
# requirepass will be set dynamically via Docker command

# General settings
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Persistence settings - optimized for bulk operations
appendonly yes
appendfsync no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 10  
save ""

# Security settings
# protected-mode will be set via command line based on password presence
# requirepass will be set via command line

# Memory management - optimized for bulk operations
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Logging
loglevel notice

# Network settings
tcp-backlog 511

# Disable dangerous commands in production
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""
# rename-command DEBUG ""

# Performance settings - optimized for bulk operations
hz 10
tcp-backlog 511
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes 