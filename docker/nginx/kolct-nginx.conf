# Nginx Configuration for kolct.com and www.kolct.com
# This handles the main domain with specific redirects for /verify/ paths

# HTTP Server Block - handles ACME challenges and redirects to HTTPS
server {
    listen 80;
    server_name kolct.com www.kolct.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block for kolct.com and www.kolct.com
server {
    listen 443 ssl http2;
    server_name kolct.com www.kolct.com;

    # SSL Configuration (will be managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/kolct.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolct.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client settings
    client_body_buffer_size 200K;
    client_header_buffer_size 2k;
    client_max_body_size 100M;
    large_client_header_buffers 8 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;

    # Specific redirect for /verify/ paths to dev.kolct.com
    location ~ ^/verify/([A-Za-z0-9]+)$ {
        return 301 https://dev.kolct.com/sales/card-creation/kolct-ral?token=$1;
    }

    # Main location - serve your production frontend or API
    location / {
        # Option 1: If you have a production frontend on a different port
        # proxy_pass http://localhost:YOUR_PRODUCTION_PORT;
        
        # Option 2: If you want to serve static files
        # root /var/www/kolct;
        # try_files $uri $uri/ /index.html;
        
        # Option 3: Proxy to your production backend
        # proxy_pass http://localhost:8009;
        
        # For now, you can serve a simple landing page or API
        # Uncomment and modify based on your needs
        proxy_pass http://localhost:4018;  # Or your production frontend port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Favicon
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
}

# Separate server block for dev.kolct.com
server {
    listen 80;
    server_name dev.kolct.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dev.kolct.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/dev.kolct.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.kolct.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client settings
    client_body_buffer_size 200K;
    client_header_buffer_size 2k;
    client_max_body_size 100M;
    large_client_header_buffers 8 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    # Main app
    location / {
        proxy_pass http://localhost:4018;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100M;
    }

    # Sales card creation
    location /sales/card-creation {
        proxy_pass http://localhost:8083/sales/card-creation;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100M;
    }

    # Sales
    location /sales {
        proxy_pass http://localhost:8084/sales;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100M;
    }
}