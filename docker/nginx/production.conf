# Redirect HTTP to HTTPS only if SSL certificates exist
server {
    listen 80;
    server_name localhost;  # Updated for local development

    # Let's Encrypt ACME challenge handler
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # For testing without SSL, serve directly
    # In production, uncomment the return statement below after SSL setup
    # return 301 https://$host$request_uri;

    # React assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Django backend
    location /api/ {
        proxy_pass http://kolct_backend:8009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
        
        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }

    # Django Admin and Documentation
    location ~ ^/(admin|api/docs|api/schema)/ {
        proxy_pass http://kolct_backend:8009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }

    # Django Static Files
    location /static/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
        
        # Add proper MIME type handling
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Handle JavaScript files
        location ~* \.js$ {
            add_header Content-Type application/javascript;
        }
        
        # Handle CSS files
        location ~* \.css$ {
            add_header Content-Type text/css;
        }
    }

    # Django Media Files
    location /media/ {
        alias /media/;
        expires 7d;
        access_log off;
    }
}

