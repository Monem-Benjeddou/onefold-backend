# Host Nginx Configuration for KOLCT API Production
# Place this file in /etc/nginx/sites-available/kolct-api
# Then symlink to /etc/nginx/sites-enabled/kolct-api
#
# sudo ln -s /etc/nginx/sites-available/kolct-api /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

upstream kolct_backend {
    server 127.0.0.1:8009;  # Adjust port if API_PORT is different
    keepalive 32;
}

# HTTP Server Block for kolct.com and www.kolct.com (Let's Encrypt ACME challenges)
server {
    listen 80;
    server_name kolct.com www.kolct.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/kolct-access.log;
    error_log /var/log/nginx/kolct-error.log;

    # Let's Encrypt ACME challenge - serve files directly without redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

}

# HTTPS Server Block for kolct.com and www.kolct.com
server {
    listen 443 ssl http2;
    server_name kolct.com www.kolct.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/kolct.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolct.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/kolct.com/chain.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self';" always;

    # Logging
    access_log /var/log/nginx/kolct-access.log;
    error_log /var/log/nginx/kolct-error.log;

    # API and Admin routes
    location /api/ {
        proxy_pass http://kolct_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        # Handle long requests
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /admin/ {
        proxy_pass http://kolct_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Health check endpoint
    location /health/ {
        proxy_pass http://kolct_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Fallback to backend for any other requests
    location @backend {
        proxy_pass http://kolct_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend application (if you have one)
    location / {
        # If you have a separate frontend, configure it here
        # Otherwise, this could redirect to /api/ or show a landing page
        try_files $uri $uri/ @backend;
    }
}

 