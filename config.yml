environment:
  development:
    django_settings_module: api.config.settings.development
    logging:
      level: DEBUG
      console_level: DEBUG
      file_level: DEBUG
      file_path: logs/django_dev.log

  production:
    django_settings_module: api.config.settings.production
    logging:
      level: INFO
      console_level: INFO
      file_level: WARNING
      file_path: logs/django_prod.log

  testing:
    django_settings_module: api.config.settings.testing
    logging:
      level: WARNING

database:
  development:
    host: kolct_db
    port: 5432
    test_database_name: test_postgres
    atomic_requests: true
    conn_max_age: 60
    
    conn_health_checks: true
    options:
      statement_timeout: 30000  
      lock_timeout: 10000       
      idle_in_transaction_session_timeout: 300000  
      connect_timeout: 10
      tcp_keepalives_idle: 600
      tcp_keepalives_interval: 30
      tcp_keepalives_count: 3
  production:
    host: kolct_db_prod
    port: 5432
    test_database_name: test_postgres
    atomic_requests: true
    conn_max_age: 600
    
    conn_health_checks: true
    options:
      statement_timeout: 60000  
      lock_timeout: 15000       
      idle_in_transaction_session_timeout: 600000  
      connect_timeout: 10
      tcp_keepalives_idle: 600
      tcp_keepalives_interval: 30
      tcp_keepalives_count: 3

redis:
  development:
    host: kolct_redis
    port: 6379
    cache_db: 1
    celery_broker_db: 0
    celery_result_db: 0
    session_db: 2
    
    connection_pool_max_connections: 100  
    socket_connect_timeout: 2  
    socket_timeout: 5  
    retry_on_timeout: true
    health_check_interval: 10  
    socket_keepalive: true
    socket_keepalive_options: {}
  production:
    host: kolct_redis
    port: 6379
    cache_db: 1
    celery_broker_db: 0
    celery_result_db: 0
    session_db: 2
    
    connection_pool_max_connections: 100  
    socket_connect_timeout: 2  
    socket_timeout: 5  
    retry_on_timeout: true
    health_check_interval: 10  
    socket_keepalive: true
    socket_keepalive_options: {}

storage:
  development:
    static_root: staticfiles
    media_root: media
    use_s3: false
  production:
    static_root: /var/www/static
    media_root: /var/www/media
    use_s3: true

silk:
  authentication: true
  authorisation: true
  intercept_percent: 100
  meta: true
  python_profiler: true
  max_recorded_requests: 10000

session:
  cookie_age: 1209600
  cookie_httponly: true
  cookie_samesite: Lax
  save_every_request: false

email:
  development:
    backend: django.core.mail.backends.console.EmailBackend
    timeout: 30
  production:
    backend: django.core.mail.backends.smtp.EmailBackend
    timeout: 30

celery:
  broker_url_template: "redis://%s:%s/%s"
  result_backend_template: "redis://%s:%s/%s"
  timezone: UTC
  task_time_limit: 7200  
  worker_disable_rate_limits: true
  worker_prefetch_multiplier: 1
  worker_max_tasks_per_child: 10  
  worker_concurrency: 4  
  task_track_started: true
  worker_state_db: "/tmp/celery_worker_state"
  worker_max_memory_per_child: 8589934592  
  
  task_soft_time_limit: 6000  
  worker_hijack_root_logger: false
  worker_log_color: false
  development:
    task_always_eager: false
    task_eager_propagates: true
  production:
    task_always_eager: false
    broker_connection_retry_on_startup: true
    broker_connection_max_retries: 10
  testing:
    task_always_eager: true
    task_eager_propagates: true
    broker_backend: memory


statistics:
  
  batch_size: 1000  
  page_size: 500    
  max_workers: 2    

  
  query_timeout: 30      
  cache_timeout: 300     

  
  max_concurrent_tasks: 3     
  task_retry_delay: 60        
  max_retries: 3              

  
  daily_stats_time: "01:00"      
  weekly_stats_time: "02:00"     
  monthly_stats_time: "03:00"    
  cleanup_time: "04:00"          



webui:
  development:
    port: 3031
    auth: false
    name: "TheProperHumanDiet AI"
    url: "http://localhost:3031"
  production:
    port: 3031
    auth: true
    name: "TheProperHumanDiet AI"
    url: "https://ai.yourdomain.com"

storybook:
  port: 6006

security:
  browser_xss_filter: true
  content_type_nosniff: true
  hsts_include_subdomains: true
  hsts_preload: true
  proxy_ssl_header:
    - "HTTP_X_FORWARDED_PROTO"
    - "https"
  password_validators:
    min_length: 8

session:
  cookie_httponly: true
  cookie_samesite: Lax
  cookie_age: 1209600
  development:
    cookie_secure: false
  production:
    cookie_secure: true

csrf:
  cookie_httponly: true
  cookie_samesite: Lax
  development:
    cookie_secure: false
  production:
    cookie_secure: true

jwt:
  access_token_lifetime_minutes: 30
  refresh_token_lifetime_days: 7
  rotate_refresh_tokens: true
  blacklist_after_rotation: true
  algorithm: HS256
  auth_header_types:
    - Bearer
  user_id_field: id
  user_id_claim: user_id
  token_type_claim: token_type
  jti_claim: jti

cors:
  allow_credentials: true
  allow_methods:
    - DELETE
    - GET
    - OPTIONS
    - PATCH
    - POST
    - PUT
  allow_headers:
    - accept
    - accept-encoding
    - authorization
    - content-type
    - dnt
    - origin
    - user-agent
    - x-csrftoken
    - x-requested-with
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3018
    - http://localhost:5173
    - http://localhost:8009

rate_limiter:
  enabled: false
  default_rate: "100/day"
  sensitive_rate: "10/minute"
  default_period: 1

oauth:
  social_auth_allowed_redirect_uris:
    - http://127.0.0.1:3000
    - http://localhost:3000
    - https://yourdomain.com
  postgres_jsonfield: true
  url_namespace: social
  login_redirect_url: /
  login_error_url: /login-error/
  username_is_full_email: true
  admin_user_search_fields:
    - username
    - first_name
    - email

admin:
  

site:
  name: "Kolct"
  development:
    url: "http://localhost:8009"
  production:
    url: "https://kolct-api.neothons.com"

content_types:
  file: 16
  image: 15
  text: 13
  video: 12

storage:
  development:
    backend: local
    media_root: /app/media/
    static_root: /app/static/
  production:
    backend: s3
    bucket_name: yourdomain-storage
    region: us-east-1
    signature_version: s3v4
    file_overwrite: false
    default_acl: null
    verify: true

silk:
  authentication: true
  authorisation: true
  intercept_percent: 10
  meta: false
  python_profiler: false
  max_recorded_requests: 1000

health_check:
  disk_usage_max: 90
  memory_min: 100

logging:
  development:
    level: DEBUG
    console_level: DEBUG
    file_level: DEBUG
    file_path: "/tmp/django_dev.log"
  production:
    level: INFO
    console_level: WARNING
    file_level: INFO
    file_path: "/tmp/django_prod.log"

axes:
  failure_limit: 5
  lock_out_at_failure: true
  cooloff_time: 1
  use_user_agent: true
  lock_out_by_combination_user_and_ip: true
  reset_on_success: true
  only_admin_site: false

silky:
  python_profiler: false
  python_profiler_binary: false
  authentication: true
  authorisation: true
  meta: true
  intercept_percent: 100
  max_recorded_requests: 10000
  max_recorded_requests_check_percent: 10

i18n:
  language_code: en-us
  time_zone: UTC
  use_i18n: true
  use_l10n: true
  use_tz: true
  languages:
    - code: en
      name: English
    - code: fr
      name: French
    - code: es
      name: Spanish
    - code: ar
      name: Arabic
    - code: de
      name: German

calculators:
  macro:
    min_calories: 800
    max_calories: 8000
  water_intake:
    default_target_ml: 2000
    max_target_ml: 5000
  bmi:
    min_weight_kg: 30
    max_weight_kg: 300
    min_height_cm: 100
    max_height_cm: 250

django_q:
  development:
    workers: 2
    timeout: 30
    retry: 60
    queue_limit: 50
  production:
    workers: 8
    timeout: 60
    retry: 120
    queue_limit: 200

monitoring:
  development:
    sentry:
      enabled: false
      dsn: ""
        
  production:
    sentry:
      enabled: true
      dsn: ""  
      environment: "production"
      sample_rate: 1.0
      notification_channels:
        - slack
        - email
        - pagerduty

backup:
  development:
    enabled: false
    
  production:
    database:
      enabled: true
      schedule: "0 2 * * *"  
      retention_days: 30
      encryption: true
      destinations:
        - aws_s3
        - azure_blob
    files:
      enabled: true
      schedule: "0 3 * * *"  
      retention_days: 90
    configuration:
      enabled: true
      schedule: "0 1 * * 0"  
      retention_weeks: 12
