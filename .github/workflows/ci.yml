name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onefold
          POSTGRES_USER: onefold
          POSTGRES_PASSWORD: onefold
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onefold"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: onefold
      POSTGRES_USER: onefold
      POSTGRES_PASSWORD: onefold
      POSTGRES_HOST: localhost
      TEST_USE_SQLITE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: DEBUG=1 python manage.py makemigrations --check --dry-run
      - name: Content is valid
        run: DEBUG=1 python manage.py sync_content --check
      - name: Tests (PostgreSQL)
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t onefold-api .
      - name: Build web image
        run: docker build -t onefold-web web
