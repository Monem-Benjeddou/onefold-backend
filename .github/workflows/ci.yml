name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Tests (Onefold apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      # The inherited apps' suites don't pass yet (see MVP_PLAN.md, section 9.1);
      # CI gates on the new apps until they're fixed or removed.
      - name: Run tests
        run: python -m pytest api/apps/learning api/apps/projects api/apps/verification api/config/settings/tests/test_cron_schedule.py

  build:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: docker build -f docker/backend/Dockerfile --target production .
