name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onefold
          POSTGRES_USER: onefold
          POSTGRES_PASSWORD: onefold
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onefold"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: onefold
      POSTGRES_USER: onefold
      POSTGRES_PASSWORD: onefold
      POSTGRES_HOST: localhost
      TEST_USE_SQLITE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: DEBUG=1 python manage.py makemigrations --check --dry-run
      - name: Content is valid
        run: DEBUG=1 python manage.py sync_content --check
      - name: Tests (PostgreSQL)
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    # A real browser against the whole stack: API, web app and the Mailpit inbox.
    runs-on: ubuntu-latest
    needs: [test, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onefold
          POSTGRES_USER: onefold
          POSTGRES_PASSWORD: onefold
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onefold"
          --health-interval 3s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports: ["1025:1025", "8025:8025"]
    env:
      DEBUG: "1"
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      POSTGRES_DB: onefold
      POSTGRES_USER: onefold
      POSTGRES_PASSWORD: onefold
      POSTGRES_HOST: localhost
      FRONTEND_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      DEV_MAIL_INBOX_URL: http://localhost:8025
      CELERY_TASK_ALWAYS_EAGER: "1"
      BACKEND_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WEB_URL: http://localhost:3000
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: pip install -r requirements-dev.txt
      - name: Start the API (migrated, content loaded, demo data seeded)
        run: |
          python manage.py migrate --noinput
          python manage.py sync_content --publish
          python manage.py seed
          nohup python manage.py runserver 127.0.0.1:8000 > api.log 2>&1 &
      - name: Build and start the web app
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
      - name: Wait for both
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health/ && curl -sf http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          cat api.log web.log; exit 1
      - name: End-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            web.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t onefold-api .
      - name: Build web image
        run: docker build -t onefold-web web
