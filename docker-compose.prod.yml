services:
  kolct_backend:
    container_name: ${PROJECT_NAME:-kolct}_django_prod_backend
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: production
    command: daphne -b 0.0.0.0 -p 8009 config.asgi:application
    ports:
      - "8009:8009" # Expose backend on 8009 for production
    env_file:
      - ../.env.production
    restart: unless-stopped
    networks:
      - app_network

  kolct_celery_worker:
    container_name: ${PROJECT_NAME:-kolct}_celery_prod_worker
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: production
    command: celery -A config worker -l info
    env_file:
      - ../.env.production
    restart: unless-stopped
    depends_on:
      - kolct_backend
    networks:
      - app_network

networks:
  app_network:
    name: ${PROJECT_NAME:-kolct}_network_prod
    driver: bridge
