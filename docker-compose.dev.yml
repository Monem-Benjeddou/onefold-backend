services:
  nevo_db:
    image: postgres:15-alpine
    container_name: nevo_postgres_dev_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nevo_db
    ports:
      - "5432:5432"
    command: postgres -c shared_buffers=128MB -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 3
    restart: unless-stopped
    networks:
      - app_network

  nevo_redis:
    image: redis:alpine
    container_name: nevo_redis_dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - app_network

  nevo-backend:
    container_name: nevo_django_dev_backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    working_dir: /app/api
    volumes:
      - ./api:/app/api
      - ./docker/backend:/app/docker
    ports:
      - "8009:8009"
    environment:
      - DATABASE_HOST=nevo_db
      - DATABASE_INTERNAL_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=nevo_db
      - REDIS_URL=redis://nevo_redis:6379/0
      - DJANGO_SETTINGS_MODULE=api.config.settings.development
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    depends_on:
      nevo_db:
        condition: service_healthy
      nevo_redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
