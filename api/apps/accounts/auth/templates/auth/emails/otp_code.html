<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Your Login OTP Code</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
        <h2>Your Login OTP Code</h2>
        <p>Hello{% if user.fullname %} {{ user.fullname }}{% endif %},</p>
        <p>Your OTP code for login is:</p>
        <div style="background-color: #f8f9fa; border: 2px solid #dee2e6; border-radius: 4px; padding: 20px; text-align: center; margin: 20px 0;">
            <h1 style="color: #007bff; letter-spacing: 10px; margin: 0; font-size: 36px;">{{ code }}</h1>
        </div>
        <p>This code will expire in 10 minutes.</p>
        <p>If you didn't request this code, please ignore this email.</p>
        <hr style="border: none; border-top: 1px solid #dee2e6; margin: 30px 0;">
        <p style="color: #6c757d; font-size: 14px;">This is an automated message, please do not reply.</p>
    </div>
</body>
</html>
