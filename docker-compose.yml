services:
  kolct_db:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-kolct}_postgres_${CONTAINER_SUFFIX:-dev}_db
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "${DATABASE_PORT}:${DATABASE_INTERNAL_PORT}"
    # Use config file for memory settings, don't override with env vars
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_connections=200
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c max_wal_size=4GB
      -c min_wal_size=1GB
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Resource constraints for PostgreSQL (8GB allocation)
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 6G
          cpus: "2.0"
    networks:
      app_network:
        aliases:
          - kolct_db

  kolct_redis:
    image: redis:alpine
    container_name: ${PROJECT_NAME:-kolct}_redis_${CONTAINER_SUFFIX:-dev}
    command: >
      sh -c "
      if [ ! -z \"$${REDIS_PASSWORD}\" ] && [ \"$${REDIS_PASSWORD}\" != \"\" ]; then
        echo \"Starting Redis with authentication and optimized memory...\"
        redis-server /usr/local/etc/redis/redis.conf --requirepass $${REDIS_PASSWORD} --maxmemory 5g --maxmemory-policy allkeys-lru --save 300 10 --save 60 10000
      else
        echo \"Starting Redis without authentication for development with optimized memory...\"
        redis-server /usr/local/etc/redis/redis.conf --protected-mode no --maxmemory 5g --maxmemory-policy allkeys-lru --save 300 10 --save 60 10000
      fi
      "
    volumes:
      - redis_data:/var/lib/redis
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    env_file:
      - ../.env
    restart: unless-stopped
    networks:
      - app_network

  pgbouncer:
    build:
      context: ./pgbouncer
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-kolct}_pgbouncer_${CONTAINER_SUFFIX:-dev}
    ports:
      - "${PGBOUNCER_EXTERNAL_PORT:-6432}:6432"
    environment:
      - DATABASES_HOST=kolct_db
      - DATABASES_PORT=5432
      - DATABASES_USER=${DATABASE_USER}
      - DATABASES_PASSWORD=${DATABASE_PASSWORD}
      - DATABASES_DBNAME=${DATABASE_NAME}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=3
    depends_on:
      kolct_db:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    restart: unless-stopped
    networks:
      - app_network

  kolct_backend:
    container_name: ${PROJECT_NAME:-kolct}_django_${CONTAINER_SUFFIX:-dev}_backend
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: ${BACKEND_TARGET:-${DOCKER_TARGET:-development}}
      args:
        - ENV=${ENV}
    volumes:
      - ../api:/app
      - ./backend:/app/docker
      - ./config.yml:/app/docker/config.yml
      - ../api/staticfiles:/app/staticfiles
      - ../api/media:/app/media
    ports:
      - "${API_PORT}:${API_PORT}"
    env_file:
      - ../.env
    environment:
      - PYTHONMALLOC=malloc
      - MALLOC_TRIM_THRESHOLD_=100000
      - PYTHONHASHSEED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Optimize Django for production workloads
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-2}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-1000}
      - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-50}
    depends_on:
      kolct_db:
        condition: service_healthy
      kolct_redis:
        condition: service_started
    restart: unless-stopped
    # Resource constraints for Django Backend (4GB allocation)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 2G
          cpus: "2.0"
    networks:
      - app_network

  kolct_celery_worker:
    container_name: ${PROJECT_NAME:-kolct}_celery_${CONTAINER_SUFFIX:-dev}_worker
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: ${BACKEND_TARGET:-${DOCKER_TARGET:-development}}
      args:
        - ENV=${ENV}
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-8} --max-tasks-per-child=100 --pool=prefork
    volumes:
      - ../api:/app
      - ./backend:/app/docker
      - ./config.yml:/app/docker/config.yml
      - ../api/staticfiles:/app/staticfiles
      - ../api/media:/app/media
    env_file:
      - ../.env
    environment:
      - CELERY_OPTIMIZATION_PROFILE=high_memory
      - PYTHONMALLOC=malloc
      - MALLOC_TRIM_THRESHOLD_=100000
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-8}
      - CELERY_WORKER_PREFETCH_MULTIPLIER=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      - CELERY_WORKER_MAX_MEMORY_PER_CHILD=${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-400000}
      - CELERY_RESULT_BACKEND_MAX_CONNECTIONS=${CELERY_RESULT_BACKEND_MAX_CONNECTIONS:-50}
    depends_on:
      - kolct_backend
      - kolct_redis
    restart: unless-stopped
    # Resource constraints for Celery Workers (4GB allocation)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"
    networks:
      - app_network

  kolct_celery_beat:
    container_name: ${PROJECT_NAME:-kolct}_celery_${CONTAINER_SUFFIX:-dev}_beat
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: ${BACKEND_TARGET:-${DOCKER_TARGET:-development}}
      args:
        - ENV=${ENV}
    command: celery -A config beat -l info
    volumes:
      - ../api:/app
      - ./backend:/app/docker
      - ./config.yml:/app/docker/config.yml
      - ../api/staticfiles:/app/staticfiles
      - ../api/media:/app/media
    env_file:
      - ../.env
    environment:
      - PYTHONMALLOC=malloc
      - MALLOC_TRIM_THRESHOLD_=100000
      - PYTHONHASHSEED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      kolct_db:
        condition: service_healthy
      kolct_redis:
        condition: service_started
      kolct_backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource constraints for Celery Beat (lightweight scheduler)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    networks:
      - app_network

volumes:
  postgres_data_dev:
    name: ${PROJECT_NAME:-kolct}_postgres_data_${CONTAINER_SUFFIX:-dev}
  redis_data:
    name: ${PROJECT_NAME:-kolct}_redis_data_${CONTAINER_SUFFIX:-dev}
  redis-config:
    name: ${PROJECT_NAME:-kolct}_redis_config_${CONTAINER_SUFFIX:-dev}

networks:
  app_network:
    name: ${PROJECT_NAME:-kolct}_network_${CONTAINER_SUFFIX:-dev}
    driver: bridge
