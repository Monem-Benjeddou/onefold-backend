# Local development: `cp .env.example .env && docker compose up --build`
# App: http://localhost:3000  ·  API: http://localhost:8000  ·  API docs: /api/docs/

x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    # The web container calls the API as http://api:8000, so Django must
    # accept the "api" host too (otherwise every call is a 400 DisallowedHost).
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},api
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onefold}
      POSTGRES_USER: ${POSTGRES_USER:-onefold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    # Migrate, load content, seed demo accounts (unless SEED_DEMO_DATA=0), serve.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py sync_content --publish &&
             if [ \"$${SEED_DEMO_DATA:-1}\" != \"0\" ]; then python manage.py seed || echo 'Seeding failed; continuing.'; fi &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2

  # The Next.js web app, with hot reload. It talks to the API server-side.
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx next dev -H 0.0.0.0 -p 3000"
    environment:
      BACKEND_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  web_node_modules:
  web_next:
