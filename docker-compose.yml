# Local development stack: `docker compose up --build` from the repo root.
#
# The services are defined once, in docker/docker-compose.yml (also used by
# `make up`). Paths inside it are relative to docker/, so they resolve to this
# repo. Variables come from .env at the repo root (copy .env.example).
include:
  - path: docker/docker-compose.yml
    env_file: .env
